<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBT スキルトレーニング｜マインドフルネス</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #F7F9FA; color: #2A4A55; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

  /* ヘッダー */
  header {
    background: #fff; border-bottom: 1px solid #E0ECEF;
    padding: 16px 20px 14px; position: sticky; top: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-family: 'Noto Serif JP', serif; font-size: 18px; color: #1A3A45; font-weight: 700; }
  .module-badge {
    font-size: 11px; color: #E8A855; font-weight: 700;
    background: #FFF8EC; padding: 2px 8px; border-radius: 20px; border: 1px solid #E8C878;
  }

  /* タブ */
  nav.tabs {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; background: #fff;
    border-top: 1px solid #E0ECEF; display: flex; z-index: 20;
  }
  .tab-btn {
    flex: 1; padding: 12px 0; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border-top: 2.5px solid transparent; transition: border-color 0.18s;
  }
  .tab-btn.active { border-top-color: #2D6A7F; }
  .tab-btn .tab-icon { font-size: 18px; }
  .tab-btn .tab-label { font-size: 11px; color: #8AABB8; font-family: 'Noto Sans JP', sans-serif; }
  .tab-btn.active .tab-label { color: #2D6A7F; font-weight: 700; }

  /* ページ */
  .page { display: none; padding: 0 0 80px; }
  .page.active { display: block; }

  /* フィルター */
  .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding: 16px 20px 12px; }
  .filter-btn {
    border: none; border-radius: 20px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    background: #E8F0F4; color: #2D6A7F;
    font-family: 'Noto Sans JP', sans-serif; transition: all 0.18s;
  }
  .filter-btn.active { background: #2D6A7F; color: #fff; }

  /* スキルカード */
  .skills-list { padding: 0 16px; }
  .skill-card {
    display: block; width: 100%; background: #fff; border: 1px solid #D8EAEF;
    border-radius: 14px; padding: 16px; margin-bottom: 10px; cursor: pointer;
    text-align: left; font-family: 'Noto Sans JP', sans-serif;
    box-shadow: 0 1px 4px rgba(45,106,127,0.08); transition: box-shadow 0.18s, transform 0.12s;
  }
  .skill-card:hover { box-shadow: 0 4px 16px rgba(45,106,127,0.15); transform: translateY(-1px); }
  .skill-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .category-badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.03em;
  }
  .cat-core { background: #E8F4F8; color: #2D6A7F; }
  .cat-what { background: #FFF3E0; color: #B07020; }
  .cat-how  { background: #F0F4FF; color: #4A5BA8; }
  .intensity-dots { display: flex; gap: 4px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.on { background: #2D6A7F; }
  .dot.off { background: #D0DFE5; }
  .intensity-label { font-size: 11px; color: #7A9BAA; margin-left: 4px; }
  .skill-name { font-family: 'Noto Serif JP', serif; font-size: 17px; font-weight: 700; color: #1A3A45; margin-bottom: 2px; }
  .skill-subtitle { font-size: 13px; color: #7A9BAA; margin-bottom: 8px; }
  .skill-desc { font-size: 13px; color: #4A6A75; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* 詳細ビュー */
  #detail-view { display: none; padding: 0 0 80px; }
  #detail-view.active { display: block; }
  .back-btn {
    background: none; border: none; color: #2D6A7F; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; padding: 16px 20px;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .detail-body { padding: 0 20px; }
  .detail-desc {
    background: #EAF4F8; border-left: 3px solid #2D6A7F;
    border-radius: 0 8px 8px 0; padding: 14px 16px; margin: 20px 0;
    font-size: 14px; color: #1A3A45; line-height: 1.8;
  }
  .detail-h3 { font-family: 'Noto Serif JP', serif; color: #2D6A7F; font-size: 15px; margin-bottom: 12px; }
  .howto-list { padding-left: 20px; margin-bottom: 24px; }
  .howto-list li { font-size: 14px; color: #2A4A55; line-height: 1.9; margin-bottom: 6px; padding-left: 4px; }
  .when-box {
    background: #FFF8EC; border: 1px solid #E8C878; border-radius: 10px; padding: 12px 16px;
  }
  .when-label { font-size: 12px; color: #B07020; font-weight: 600; display: block; margin-bottom: 6px; }
  .when-text { font-size: 14px; color: #5A4010; line-height: 1.7; }

  /* ダイアリーカード */
  .diary-wrap { padding: 20px 20px 0; }
  .diary-title { font-family: 'Noto Serif JP', serif; font-size: 20px; color: #1A3A45; margin-bottom: 4px; }
  .diary-date { font-size: 13px; color: #7A9BAA; margin-bottom: 20px; }
  .section-label {
    font-size: 11px; font-weight: 700; color: #7A9BAA;
    letter-spacing: 0.08em; margin-bottom: 6px; display: block;
  }
  .section-block { margin-bottom: 28px; }
  .emotion-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .emotion-emoji { font-size: 20px; width: 28px; text-align: center; }
  .emotion-name { font-size: 13px; color: #2A4A55; font-weight: 500; width: 58px; }
  .score-btns { display: flex; gap: 6px; flex: 1; }
  .score-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid #D0DFE5;
    background: #F7F9FA; color: #7A9BAA; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans JP', sans-serif;
  }
  .urge-btns { display: flex; gap: 8px; }
  .urge-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid #D0DFE5;
    background: #F7F9FA; color: #7A9BAA; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans JP', sans-serif;
  }
  .skills-used { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-toggle {
    padding: 7px 14px; border-radius: 20px; border: 1.5px solid #D0DFE5;
    background: #F7F9FA; color: #6A8A96; font-size: 13px; cursor: pointer;
    transition: all 0.15s; font-family: 'Noto Sans JP', sans-serif;
  }
  .skill-toggle.selected { background: #2D6A7F; color: #fff; border-color: #2D6A7F; }
  textarea {
    width: 100%; border-radius: 10px; border: 1.5px solid #D0DFE5;
    padding: 10px 12px; font-size: 14px; color: #2A4A55; line-height: 1.7;
    resize: vertical; font-family: 'Noto Sans JP', sans-serif;
    background: #FAFCFD; outline: none; transition: border-color 0.15s;
  }
  textarea:focus { border-color: #2D6A7F; }
  .primary-btn {
    width: 100%; background: #2D6A7F; color: #fff; border: none;
    border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
    transition: background 0.3s; letter-spacing: 0.04em;
  }
  .primary-btn.saved { background: #5AA87A; }
  .hint-text { font-size: 12px; color: #9AABBC; margin-bottom: 8px; line-height: 1.6; }

  /* ワークシート */
  .ws-list { padding: 20px 16px 0; }
  .ws-list h2 { font-family: 'Noto Serif JP', serif; font-size: 20px; color: #1A3A45; margin-bottom: 16px; padding-left: 4px; }
  .ws-card {
    display: block; width: 100%; background: #fff; border: 1px solid #D8EAEF;
    border-radius: 14px; padding: 16px; margin-bottom: 10px; cursor: pointer;
    text-align: left; font-family: 'Noto Sans JP', sans-serif;
    box-shadow: 0 1px 4px rgba(45,106,127,0.08); transition: box-shadow 0.18s;
  }
  .ws-card:hover { box-shadow: 0 4px 16px rgba(45,106,127,0.15); }
  .ws-card .ws-title { font-family: 'Noto Serif JP', serif; font-size: 16px; font-weight: 700; color: #1A3A45; margin: 8px 0 4px; }
  .ws-card .ws-desc { font-size: 13px; color: #6A8A96; line-height: 1.6; }

  /* ワークシート詳細 */
  #ws-detail { display: none; padding: 0 0 80px; }
  #ws-detail.active { display: block; }
  .ws-field { margin-bottom: 20px; }
  .ws-field label { display: block; font-size: 13px; font-weight: 600; color: #2D6A7F; margin-bottom: 6px; }
  .ws-field input[type=text] {
    width: 100%; border-radius: 10px; border: 1.5px solid #D0DFE5;
    padding: 10px 12px; font-size: 14px; color: #2A4A55;
    font-family: 'Noto Sans JP', sans-serif; background: #FAFCFD; outline: none;
    transition: border-color 0.15s;
  }
  .ws-field input[type=text]:focus { border-color: #2D6A7F; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>DBT スキルトレーニング</h1>
    <span class="module-badge">マインドフルネス</span>
  </header>

  <!-- スキルページ -->
  <div id="page-skills" class="page active">
    <h2 style="font-family:'Noto Serif JP',serif;font-size:20px;color:#1A3A45;padding:20px 20px 0;">マインドフルネス</h2>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="skills-list" id="skills-list"></div>
  </div>

  <!-- ダイアリーカードページ -->
  <div id="page-diary" class="page">
    <div class="diary-wrap">
      <h2 class="diary-title">ダイアリーカード</h2>
      <p class="diary-date" id="today-date"></p>

      <div class="section-block">
        <span class="section-label">感情の強さ（0〜5）</span>
        <div id="emotion-rows"></div>
      </div>

      <div class="section-block">
        <span class="section-label">自傷・他害行動の衝動（0〜5）</span>
        <p class="hint-text">行動したかどうかではなく、衝動の強さを記録します</p>
        <div class="urge-btns" id="urge-btns"></div>
      </div>

      <div class="section-block">
        <span class="section-label">今日使ったスキル</span>
        <div class="skills-used" id="skills-used"></div>
      </div>

      <div class="section-block">
        <span class="section-label">今日のメモ</span>
        <textarea id="diary-note" rows="4" placeholder="気づいたこと、難しかったこと、うまくいったことなど…"></textarea>
      </div>

      <button class="primary-btn" id="diary-save-btn">今日の記録を保存</button>
      <div style="height:20px"></div>
    </div>
  </div>

  <!-- ワークシートページ -->
  <div id="page-worksheet" class="page">
    <div class="ws-list">
      <h2>ワークシート</h2>
      <div id="ws-list"></div>
    </div>
  </div>

  <!-- スキル詳細（全ページ共通オーバーレイ） -->
  <div id="detail-view">
    <button class="back-btn" id="detail-back">← 一覧に戻る</button>
    <div class="detail-body" id="detail-body"></div>
  </div>

  <!-- ワークシート詳細 -->
  <div id="ws-detail">
    <button class="back-btn" id="ws-detail-back">← ワークシート一覧</button>
    <div style="padding:0 20px" id="ws-detail-body"></div>
  </div>

  <!-- ボトムナビ -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="skills">
      <span class="tab-icon">✦</span><span class="tab-label">スキル</span>
    </button>
    <button class="tab-btn" data-tab="diary">
      <span class="tab-icon">📋</span><span class="tab-label">ダイアリー</span>
    </button>
    <button class="tab-btn" data-tab="worksheet">
      <span class="tab-icon">✏️</span><span class="tab-label">ワーク</span>
    </button>
  </nav>
</div>

<script>
// ── データ ──────────────────────────────────────────────────
const SKILLS = [
  { id:"wise-mind", name:"賢明な心（ワイズマインド）", subtitle:"感情的な心と合理的な心の交差点", category:"コアマインドフルネス",
    description:"「感情的な心」と「合理的な心」の両方が統合された状態。どちらかに引っ張られず、深いところで「正しいと感じられる」判断をする力。",
    howto:["静かな場所で座り、呼吸を整える","今直面している問題や問いを心に浮かべる","感情的な心（感情が言っていること）を聞く","合理的な心（事実・論理が言っていること）を聞く","両方の声が重なる「静かな確信」を待つ"],
    when:"重要な決断の前、感情に飲み込まれそうなとき", intensity:2 },
  { id:"observe", name:"観察する", subtitle:"ただ気づく", category:"「Whatスキル」",
    description:"言葉を使わずに体験をそのまま観察する。評価せず、変えようとせず、ただ「気づいて」いる。",
    howto:["今この瞬間、体の感覚に注意を向ける","「これは良い／悪い」と判断しない","感覚が来ては去るのをただ見ている","意識が流れてもそれも観察する"],
    when:"感情が高ぶったとき、自動的な反応を止めたいとき", intensity:1 },
  { id:"describe", name:"描写する", subtitle:"言葉にのせる", category:"「Whatスキル」",
    description:"体験に事実として言葉をあてがう。解釈や判断を混ぜずに、見えている・感じていることだけを描写する。",
    howto:["「私は～と考えている」「胸が締め付けられる感じがある」のように体験を言語化","「彼は最悪だ」→「彼が約束を破ったと私は感じている」と書き換える","解釈と事実を分けることを練習する"],
    when:"感情と思考が混乱しているとき、ダイアリーカードを書くとき", intensity:1 },
  { id:"participate", name:"参加する", subtitle:"完全に入り込む", category:"「Whatスキル」",
    description:"自意識を手放して、今やっていることに完全に没頭する。観察者にならず、体験そのものになる。",
    howto:["今やっている活動（歩く、話す、料理する）に意識を全部向ける","「うまくやろう」という評価をやめる","活動が終わるまで、ほかのことを考えない"],
    when:"慢性的な空虚感があるとき、楽しさを感じにくいとき", intensity:2 },
  { id:"nonjudgmental", name:"判断しない", subtitle:"評価をはずす", category:"「Howスキル」",
    description:"「良い・悪い・すべき」という判断の言葉を使わない。結果や事実として描写する。",
    howto:["「最悪だ」→「私が望まない結果になった」","「私はダメだ」→「今日は3回ミスをした」","判断に気づいたらそれも判断せず「判断が出てきた」とただ観察する"],
    when:"自己批判が強いとき、他者への怒りが激しいとき", intensity:2 },
  { id:"one-mindfully", name:"ワン・マインドフル", subtitle:"一度に一つのことに", category:"「Howスキル」",
    description:"今この瞬間やっていることだけに集中する。マルチタスクをやめる。",
    howto:["今やっていることを一つ決める","ほかのことが頭に浮かんだら「後で」と置いておく","タスクが終わるまで次に移らない"],
    when:"思考が散乱しているとき、圧倒されているとき", intensity:1 },
  { id:"effectively", name:"効果的に", subtitle:"目標のために動く", category:"「Howスキル」",
    description:"「正しさ」より「うまくいくこと」を選ぶ。感情に任せて行動するのではなく、自分の目標に合った行動をとる。",
    howto:["今の状況で本当に達成したいことを明確にする","「正しいことを証明する」ではなく「目標を達成する」を優先する","効果のない行動に気づいたら切り替える"],
    when:"対立する状況、治療への抵抗感があるとき", intensity:3 },
];

const EMOTIONS = [
  {label:"恐れ", emoji:"😨", color:"#7B9EC9"},
  {label:"怒り", emoji:"😠", color:"#E06060"},
  {label:"嫌悪", emoji:"🤢", color:"#7FAE8C"},
  {label:"羨望", emoji:"😒", color:"#9B8CC9"},
  {label:"嫉妬", emoji:"😤", color:"#C97BA0"},
  {label:"悲しみ", emoji:"😢", color:"#6B9EC9"},
  {label:"恥辱感", emoji:"😳", color:"#E8956D"},
  {label:"罪悪感", emoji:"😔", color:"#A89870"},
  {label:"幸福", emoji:"😊", color:"#F5C842"},
  {label:"愛", emoji:"🥰", color:"#E88AA0"},
];

const WORKSHEETS = [
  { id:"observe-practice", title:"観察スキルの練習", skill:"観察する",
    description:"感覚や感情をありのままに記録するワークシートです。",
    fields:[
      {id:"situation", label:"状況", type:"textarea", placeholder:"どこで、何が起きていましたか？"},
      {id:"body", label:"体の感覚（判断なし）", type:"textarea", placeholder:"例：胸が締め付けられる感じ、手が震えている"},
      {id:"thoughts", label:"浮かんだ考え（事実として）", type:"textarea", placeholder:"例：「失敗した」という考えが浮かんだ"},
      {id:"urge", label:"行動したくなった衝動", type:"textarea", placeholder:"例：その場を離れたかった"},
      {id:"noticed", label:"気づいたこと", type:"textarea", placeholder:"観察してみてどうでしたか？"},
    ]},
  { id:"wisemind-practice", title:"賢明な心（ワイズマインド）を探す", skill:"賢明な心（ワイズマインド）",
    description:"感情的な心と合理的な心の声を分けて聴き、賢明な心（ワイズマインド）に近づくワーク。",
    fields:[
      {id:"situation", label:"状況・問題", type:"textarea", placeholder:"今直面していること"},
      {id:"emotion-mind", label:"感情的な心が言っていること", type:"textarea", placeholder:"感情的な心はどうしたいと言っている？"},
      {id:"reason-mind", label:"合理的な心が言っていること", type:"textarea", placeholder:"事実・論理から見るとどう見える？"},
      {id:"wise-mind", label:"賢明な心（ワイズマインド）の声", type:"textarea", placeholder:"深いところで「正しい」と感じることは？（ゆっくり待っていい）"},
      {id:"action", label:"次のステップ", type:"text", placeholder:"賢明な心に従うとしたら？"},
    ]},
  { id:"nonjudge-practice", title:"判断を事実に書き換える", skill:"判断しない",
    description:"評価の言葉を事実の描写に変える練習です。",
    fields:[
      {id:"judgment1", label:"判断的な表現①", type:"text", placeholder:"例：私はダメな人間だ"},
      {id:"fact1", label:"↓ 事実として書き換える", type:"text", placeholder:"例：今日は3回約束を守れなかった"},
      {id:"judgment2", label:"判断的な表現②", type:"text", placeholder:""},
      {id:"fact2", label:"↓ 事実として書き換える", type:"text", placeholder:""},
      {id:"judgment3", label:"判断的な表現③", type:"text", placeholder:""},
      {id:"fact3", label:"↓ 事実として書き換える", type:"text", placeholder:""},
      {id:"reflection", label:"書き換えてみて気づいたこと", type:"textarea", placeholder:""},
    ]},
];

// ── 状態 ────────────────────────────────────────────────────
const state = {
  tab: "skills",
  filter: "すべて",
  emotionScores: Object.fromEntries(EMOTIONS.map(e => [e.label, 0])),
  urgeScore: 0,
  skillsUsed: [],
};

// ── カテゴリ色 ───────────────────────────────────────────────
function catClass(cat) {
  if (cat === "コアマインドフルネス") return "cat-core";
  if (cat === "「Whatスキル」") return "cat-what";
  return "cat-how";
}

// ── 習得難易度ドット ─────────────────────────────────────────
function intensityHTML(level) {
  const label = level === 1 ? "習得しやすい" : level === 2 ? "練習が必要" : "高度";
  const dots = [1,2,3].map(i =>
    `<div class="dot ${i <= level ? 'on' : 'off'}"></div>`).join("");
  return `<div class="intensity-dots">${dots}<span class="intensity-label">${label}</span></div>`;
}

// ── スキル一覧レンダリング ──────────────────────────────────
function renderSkills() {
  const categories = ["すべて","コアマインドフルネス","「Whatスキル」","「Howスキル」"];
  const fb = document.getElementById("filter-bar");
  fb.innerHTML = categories.map(c =>
    `<button class="filter-btn${state.filter===c?' active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join("");

  const filtered = state.filter === "すべて" ? SKILLS : SKILLS.filter(s => s.category === state.filter);
  const sl = document.getElementById("skills-list");
  sl.innerHTML = filtered.map(skill => `
    <button class="skill-card" onclick="showDetail('${skill.id}')">
      <div class="skill-card-header">
        <span class="category-badge ${catClass(skill.category)}">${skill.category}</span>
        ${intensityHTML(skill.intensity)}
      </div>
      <div class="skill-name">${skill.name}</div>
      <div class="skill-subtitle">${skill.subtitle}</div>
      <div class="skill-desc">${skill.description}</div>
    </button>
  `).join("");
}

function setFilter(cat) {
  state.filter = cat;
  renderSkills();
}

// ── スキル詳細 ───────────────────────────────────────────────
function showDetail(id) {
  const skill = SKILLS.find(s => s.id === id);
  if (!skill) return;
  document.getElementById("detail-back").onclick = () => hideDetail();
  document.getElementById("detail-body").innerHTML = `
    <span class="category-badge ${catClass(skill.category)}">${skill.category}</span>
    <h2 style="font-family:'Noto Serif JP',serif;font-size:26px;color:#1A3A45;margin:8px 0 4px;font-weight:700;">${skill.name}</h2>
    <p style="color:#5A8A9F;font-size:14px;margin:0 0 16px;">${skill.subtitle}</p>
    ${intensityHTML(skill.intensity)}
    <div class="detail-desc">${skill.description}</div>
    <h3 class="detail-h3">練習の手順</h3>
    <ol class="howto-list">${skill.howto.map(h => `<li>${h}</li>`).join("")}</ol>
    <div class="when-box">
      <span class="when-label">💡 こんなときに</span>
      <span class="when-text">${skill.when}</span>
    </div>
  `;
  document.querySelectorAll('.page, #ws-detail').forEach(p => p.classList.remove('active'));
  document.getElementById("detail-view").classList.add("active");
}

function hideDetail() {
  document.getElementById("detail-view").classList.remove("active");
  document.getElementById(`page-${state.tab}`).classList.add("active");
}

// ── タブ切り替え ─────────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    state.tab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("detail-view").classList.remove("active");
    document.getElementById("ws-detail").classList.remove("active");
    document.getElementById(`page-${tab}`).classList.add("active");
  });
});

// ── ダイアリーカード ─────────────────────────────────────────
function renderDiary() {
  document.getElementById("today-date").textContent =
    new Date().toLocaleDateString("ja-JP", {year:"numeric",month:"long",day:"numeric",weekday:"long"});

  // 感情行
  document.getElementById("emotion-rows").innerHTML = EMOTIONS.map(emo => `
    <div class="emotion-row">
      <span class="emotion-emoji">${emo.emoji}</span>
      <span class="emotion-name">${emo.label}</span>
      <div class="score-btns">
        ${[0,1,2,3,4,5].map(v => `
          <button class="score-btn" id="emo-${emo.label}-${v}"
            style="${state.emotionScores[emo.label]===v ? `background:${emo.color};color:#fff;border-color:${emo.color}` : ''}"
            onclick="setEmoScore('${emo.label}',${v},'${emo.color}')">${v}</button>
        `).join("")}
      </div>
    </div>
  `).join("");

  // 衝動
  document.getElementById("urge-btns").innerHTML = [0,1,2,3,4,5].map(v => `
    <button class="urge-btn" id="urge-${v}"
      style="${state.urgeScore===v ? 'background:#E06060;color:#fff;border-color:#E06060' : ''}"
      onclick="setUrge(${v})">${v}</button>
  `).join("");

  // 使ったスキル
  document.getElementById("skills-used").innerHTML = SKILLS.map(s => `
    <button class="skill-toggle${state.skillsUsed.includes(s.id)?' selected':''}"
      onclick="toggleSkill('${s.id}')">
      ${state.skillsUsed.includes(s.id) ? '✓ ' : ''}${s.name}
    </button>
  `).join("");
}

function setEmoScore(label, val, color) {
  state.emotionScores[label] = val;
  renderDiary();
}
function setUrge(val) {
  state.urgeScore = val;
  renderDiary();
}
function toggleSkill(id) {
  const idx = state.skillsUsed.indexOf(id);
  if (idx >= 0) state.skillsUsed.splice(idx, 1);
  else state.skillsUsed.push(id);
  renderDiary();
}

document.getElementById("diary-save-btn").addEventListener("click", function() {
  this.textContent = "✓ 保存しました";
  this.classList.add("saved");
  setTimeout(() => {
    this.textContent = "今日の記録を保存";
    this.classList.remove("saved");
  }, 2500);
});

// ── ワークシート一覧 ─────────────────────────────────────────
function renderWorksheets() {
  const wl = document.getElementById("ws-list");
  wl.innerHTML = WORKSHEETS.map(ws => {
    const catMap = {
      "観察する":"cat-what","賢明な心（ワイズマインド）":"cat-core","判断しない":"cat-how"
    };
    const cls = catMap[ws.skill] || "cat-core";
    return `
      <button class="ws-card" onclick="showWsDetail('${ws.id}')">
        <span class="category-badge ${cls}">スキル：${ws.skill}</span>
        <div class="ws-title">${ws.title}</div>
        <div class="ws-desc">${ws.description}</div>
      </button>
    `;
  }).join("");
}

// ── ワークシート詳細 ─────────────────────────────────────────
function showWsDetail(id) {
  const ws = WORKSHEETS.find(w => w.id === id);
  if (!ws) return;
  const catMap = {"観察する":"cat-what","賢明な心（ワイズマインド）":"cat-core","判断しない":"cat-how"};
  const cls = catMap[ws.skill] || "cat-core";
  document.getElementById("ws-detail-back").onclick = () => {
    document.getElementById("ws-detail").classList.remove("active");
    document.getElementById("page-worksheet").classList.add("active");
  };
  document.getElementById("ws-detail-body").innerHTML = `
    <span class="category-badge ${cls}">スキル：${ws.skill}</span>
    <h2 style="font-family:'Noto Serif JP',serif;font-size:22px;color:#1A3A45;margin:8px 0 6px;">${ws.title}</h2>
    <p style="font-size:13px;color:#7A9BAA;margin:0 0 24px;line-height:1.7;">${ws.description}</p>
    ${ws.fields.map(f => `
      <div class="ws-field">
        <label>${f.label}</label>
        ${f.type === "textarea"
          ? `<textarea rows="3" placeholder="${f.placeholder}"></textarea>`
          : `<input type="text" placeholder="${f.placeholder}">`
        }
      </div>
    `).join("")}
    <button class="primary-btn" id="ws-save-btn" style="margin-top:8px;">ワークシートを保存</button>
    <div style="height:20px"></div>
  `;
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("ws-detail").classList.add("active");

  document.getElementById("ws-save-btn").addEventListener("click", function() {
    this.textContent = "✓ 保存しました";
    this.classList.add("saved");
    setTimeout(() => {
      this.textContent = "ワークシートを保存";
      this.classList.remove("saved");
    }, 2500);
  });
}

// ── 初期化 ───────────────────────────────────────────────────
renderSkills();
renderDiary();
renderWorksheets();
</script>
</body>
</html>
